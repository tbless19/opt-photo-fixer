name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk OPT-Photo-Fixer.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: OPT-Photo-Fixer
          path: OPT-Photo-Fixer.apk

      - name: Publish a release you can download on your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OPT Photo Fixer (build ${{ github.run_number }})
          make_latest: true
          files: OPT-Photo-Fixer.apk
          body: |
            On your Android phone, download **OPT-Photo-Fixer.apk** below and open it to install.
            The first time, Android asks you to allow installs from your browser or Files app.
